<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Scoreline</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- which players have photos (src/ui/photoManifest.ts): the list asks for it as soon as it runs -->
    <link rel="preload" href="/img/players/manifest.json" as="fetch" crossorigin fetchpriority="low" />
    <!--
      The first frame, before any script has run (Part 21, issue #4). It is the list's header and day
      tabs as the app draws them with no data, on Live, which it opens on (Header.module.css, DayTabs.module.css,
      Shell.module.css, materials.css). The Live button's place is left empty, as the app leaves it until
      the Rive art is drawn but for the art's still (#live-sprite, below), Live on with no matches yet. It is set in this inline sheet so the page paints as soon as the HTML has arrived instead of
      after the bundle has downloaded and run. React replaces everything inside #root when it first
      commits: same boxes, same pixels, so nothing moves or flashes. It is decoration: aria-hidden,
      nothing focusable. The :root values below are the tokens' (src/app/staticFrame.test.ts holds them
      to src/styles/tokens.css), and e2e/handoff.spec.ts holds the boxes to the React header's.
    -->
    <style>
      :root{--c-bg:#000000;--c-text:#f3f2ef;--c-dim:#43423f;--c-hair:rgb(255 255 255 / 0.1);--c-live:#34e39a;--c-glass:#121212;--r-20:20px;--spectrum-2-stops:#6aaef0 0%, #c9b8e0 34%, #f2b3c9 58%, #b0243c 100%;--spectrum-3-stops:#6b58f5 0%, #a58fe6 40%, #e7c1d6 76%, #fff0e6 100%;--spectrum-5-stops:#a8c3ea 0%, #e2e2e4 38%, #c9c92a 68%, #f0eed0 100%;--font-sans:'Hanken Grotesk', system-ui, sans-serif}
      html,body,#root{height:100%}
      body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
      .sf,.sf *,.sf *::before,.sf *::after{box-sizing:border-box}
      .sf{position:fixed;inset:0;overflow:hidden;background:var(--c-bg)}
      .sf-pane{position:absolute;inset:0;isolation:isolate}
      .sf-screen{position:absolute;inset:0;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
      .sf-top{height:calc(max(62px, env(safe-area-inset-top)) + 97px);padding-top:max(62px, env(safe-area-inset-top))}
      .sf-row{display:flex;align-items:center;height:40px;padding:0 18px}
      .sf-mark{display:flex;align-items:flex-start;height:22px;margin-right:10px;position:relative;top:1.5px;flex:none}
      .sf-mark>span{display:block;width:6px}
      .sf-mark>span:nth-child(1){height:16px;margin-top:6px;background:linear-gradient(180deg,var(--spectrum-2-stops))}
      .sf-mark>span:nth-child(2){height:22px;background:linear-gradient(180deg,var(--spectrum-3-stops))}
      .sf-mark>span:nth-child(3){height:12px;margin-top:4px;background:linear-gradient(180deg,var(--spectrum-5-stops))}
      .sf-word{margin:0;font:500 25px / normal var(--font-sans);letter-spacing:-0.045em;white-space:nowrap}
      .sf-glass{position:relative;isolation:isolate;background:linear-gradient(180deg,rgb(255 255 255 / 0.045) 0%,rgb(255 255 255 / 0) 55%,rgb(255 255 255 / 0.015) 100%),rgb(18 18 18 / 0.96)}
      .sf-glass::before{content:'';position:absolute;inset:0;z-index:1;padding:1px;border-radius:inherit;background:linear-gradient(180deg,rgb(255 255 255 / 0.22) 0%,rgb(255 255 255 / 0.13) 45%,rgb(255 255 255 / 0.15) 80%,rgb(255 255 255 / 0.28) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
      .sf-live{position:relative;flex:none;width:109.96px;height:40px;margin:0 8px 0 auto}
      .sf-still{position:absolute;left:-9.45px;top:-2.11px;width:128.87px;height:44.22px}
      .sf-round{display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:var(--r-20)}
      .sf-menu{position:relative;width:16px;height:10px}
      .sf-menu>span{position:absolute;left:0;width:16px;height:1.6px;background:var(--c-text)}
      .sf-menu>span:first-child{top:0}
      .sf-menu>span:last-child{top:8.4px}
      .sf-days{position:relative;height:50px;margin:8px 18px 0}
      .sf-view{position:relative;height:50px;overflow:hidden}
      .sf-strip{position:absolute;inset:8px 0 auto;display:flex;height:40px}
      .sf-arm{display:flex;flex:1 1 0;min-width:0}
      .sf-arm:first-child{justify-content:flex-end}
      .sf-tab{position:relative;display:flex;flex:none;align-items:center;justify-content:center;height:40px;padding:0 13px;white-space:nowrap;font:500 15px / normal var(--font-sans);letter-spacing:-0.01em;color:var(--c-dim)}
      .sf-on{color:var(--c-text)}
      .sf-on::after{content:'';position:absolute;left:13px;right:13px;top:39px;height:2px;background:linear-gradient(90deg,var(--spectrum-3-stops))}
      .sf-fade{position:absolute;top:6px;width:28px;height:40px}
      .sf-fade:nth-of-type(1){left:0;background:linear-gradient(90deg,#000,rgb(0 0 0 / 0))}
      .sf-fade:nth-of-type(2){right:0;background:linear-gradient(90deg,rgb(0 0 0 / 0),#000)}
      .sf-rule{position:absolute;left:0;right:0;top:48px;height:1px;background:var(--c-hair)}
      .sf-p2,.sf-p3{display:none}
      @media (min-width:768px){
        .sf{display:flex;justify-content:center;gap:24px;padding:24px clamp(12px, calc(50vw - 372px), 31px)}
        .sf-pane{position:relative;inset:auto;flex:1 1 0;min-width:360px;max-width:440px;overflow:hidden;border-radius:30px;background:var(--c-bg)}
        .sf-pane::after{content:'';position:absolute;inset:0;z-index:5;padding:1px;border-radius:inherit;background:linear-gradient(180deg,rgb(255 255 255 / 0.22) 0%,rgb(255 255 255 / 0.13) 45%,rgb(255 255 255 / 0.15) 80%,rgb(255 255 255 / 0.28) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
        .sf-screen{padding:0}
        .sf-p2{display:block}
      }
      @media (min-width:1200px){.sf-p3{display:block}}
    </style>
    <!-- Scope the confirmed fractional-motion workaround to Firefox. -->
    <script>
      if (/Firefox\/\d/.test(navigator.userAgent)) {
        document.documentElement.dataset.scorelineFirefoxMotion = 'on';
      }
    </script>
    <link rel="stylesheet" href="/firefox-motion.css" />
  </head>
