name: Part 19 validation
on:
  push:
    branches: [codex/part-19-rive]
    paths-ignore: ['reports/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: part19
            ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p .verification
      - name: Typecheck and lint
        run: npm run typecheck && npm run lint
      - name: Unit suite
        run: npx vitest run --maxWorkers=1 --reporter=json --outputFile=.verification/unit.json
      - name: Production build and initial bundle
        run: |
          npm run build -- --manifest
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const manifest = JSON.parse(fs.readFileSync('dist/.vite/manifest.json', 'utf8'));
          const initial = new Set();
          function visit(key) {
            const chunk = manifest[key];
            if (!chunk || initial.has(chunk.file)) return;
            initial.add(chunk.file);
            for (const child of chunk.imports ?? []) visit(child);
          }
          for (const [key, chunk] of Object.entries(manifest)) if (chunk.isEntry) visit(key);
          const files = [...initial].filter(file => file.endsWith('.js')).map(file => ({file, gzip: zlib.gzipSync(fs.readFileSync('dist/' + file)).byteLength}));
          fs.writeFileSync('.verification/bundle.json', JSON.stringify({initialBytes: files.reduce((n,f) => n + f.gzip, 0), files}, null, 2));
          console.log(fs.readFileSync('.verification/bundle.json', 'utf8'));
          const bytes = files.reduce((n,f) => n + f.gzip, 0);
          if (bytes > 218555) throw new Error('Initial JS exceeds the validated Part 18 baseline: ' + bytes + ' > 218555');
          if (files.some(f => /rive|webgl|wasm/.test(f.file))) throw new Error('Rive runtime entered the initial dependency graph');
          JS
      - name: Cache real Rive package for local verification
        if: matrix.label == 'part19'
        run: tar -czf .verification/rive-runtime.tgz -C node_modules/@rive-app webgl2
      - uses: actions/upload-artifact@v4
        with:
          name: part19-build-${{ matrix.label }}
          path: |
            .verification/bundle.json
            .verification/rive-runtime.tgz
            .verification/unit.json
            dist/.vite/manifest.json
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - name: Header regression check
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=.verification/browser.json npx playwright test e2e/list.spec.ts --grep 'the header, the day tabs' --workers=1 --retries=0 --reporter=line,json
      - name: Real Rive lifecycle verification
        if: matrix.label == 'part19'
        run: |
          npx tsc -p verification/rive/tsconfig.json
          PLAYWRIGHT_JSON_OUTPUT_NAME=.verification/rive.json npx playwright test -c playwright.rive.config.ts --reporter=line,json
      - name: Moment interactions
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=.verification/moments.json npx playwright test -c playwright.moments.config.ts --reporter=json
      - name: Report verification counts
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const kind of ['unit', 'browser', 'moments', 'rive']) {
            const path = '.verification/' + kind + '.json';
            if (!fs.existsSync(path)) continue;
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log('VERIFICATION ' + JSON.stringify({kind, passed: r.numPassedTests, failed: r.numFailedTests, stats: r.stats}));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part19-${{ matrix.label }}
          path: |
            .verification/*.json
            dist/.vite/manifest.json
            test-results/
          retention-days: 7
