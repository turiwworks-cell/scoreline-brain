name: Part 20 corrected Live export
on:
  push:
    branches: [codex/part-20-moments]
    paths: ['public/rive/live-icon.riv', 'verification/rive/exports/live-icon.candidate.riv', 'verification/rive/editor-exports.js', 'verification/rive/editor-exports.spec.ts', 'playwright.live-export.config.ts', '.github/workflows/part20-live-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.live-export.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part20-corrected-live-evidence
          path: test-results/
          retention-days: 7
