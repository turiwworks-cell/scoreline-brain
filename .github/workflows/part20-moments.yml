name: Part 20 moments validation
on:
  push:
    branches: [codex/part-20-moments]
    paths: ['src/**', 'rive/**', 'public/rive/**', 'verification/rive/**', 'verification/moments-script/**', '.github/workflows/part20-moments.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck, lint and whole unit suite (one worker avoids the known demo timeout)
        run: npm run typecheck && npm run lint && npm run test -- --maxWorkers=1
      - name: Received signed export sizes and fingerprints
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          for (const [path, budget] of [['public/rive/moments.riv', 150000], ['verification/rive/exports/live-icon.candidate.riv', 60000]]) {
            if (!existsSync(path)) continue;
            const bytes = readFileSync(path);
            assert.equal(bytes.subarray(0, 4).toString(), 'RIVE');
            assert.ok(bytes.length <= budget, path + ' exceeds budget');
            console.log('EXPORT_BYTES ' + JSON.stringify({path, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex')}));
          }
          JS
      - run: npm run build
      - name: Reference extraction verification (Luau execution is tested separately with Rive CLI)
        run: node verification/moments-script/run.mjs --prepare-only
      - name: Goal, red and toast regression at phone, tablet and desktop widths
        run: npx playwright test -c playwright.moments.config.ts --reporter=line
      - name: Actual signed editor exports and real runtime lifecycle
        if: always()
        run: npx playwright test -c playwright.rive.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part20-browser-evidence
          path: test-results/
          retention-days: 7
